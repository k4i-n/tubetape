[project]
name = "tubetape"
version = "0.1.0"
description = "Save YouTube audio as mp3 or m4a, locally, via yt-dlp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "k4i-n" }
]
requires-python = ">=3.13"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
tubetape = "tubetape:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
